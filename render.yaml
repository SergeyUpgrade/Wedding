services:
  - type: web
    name: wedding-invitation
    runtime: python
    buildCommand: |
      pip install poetry
      if [ -f "poetry.lock" ]; then
        poetry install --no-dev
      else
        poetry add fastapi uvicorn --no-dev
      fi
    startCommand: |
      poetry run uvicorn app.main:app --host 0.0.0.0 --port 10000